name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile benchmark.py check_environment.py compare_runs.py diagnose_candidate_depth.py download_div2k.py evaluate.py export_presentation_results.py metrics.py model.py pairs.py research.py self_test.py train.py verify_data.py

      - name: Run unit and integration tests
        run: |
          python self_test.py
