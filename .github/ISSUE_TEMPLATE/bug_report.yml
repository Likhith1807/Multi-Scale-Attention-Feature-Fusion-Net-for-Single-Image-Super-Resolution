name: Bug Report
description: Create a report to help reproduce and fix a bug in MSAF-Net
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much relevant detail as possible.
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, PyTorch version, CUDA version, and GPU model
      placeholder: Windows 11 / Ubuntu 22.04, Python 3.12, PyTorch 2.3+cu121, RTX 4090
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact command-line arguments or code snippet to reproduce the behavior
      placeholder: |
        1. python train.py --run-dir runs/test_run ...
        2. Encounter error at step ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Error Traceback / Logs
      description: Paste terminal output and traceback logs here
      render: shell
